[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webrtc-preview-host"
version = "0.1.0"
description = "Multi-station WebRTC preview client — PyQt5 + FastAPI Web"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "PyQt5>=5.15",
  "PyQtWebEngine>=5.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
webrtc-preview = "webrtc_preview_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webrtc_preview_app = ["web/static/**/*"]
